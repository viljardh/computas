<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cæsar-chiffer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>🔐 Cæsar-chiffer</h1>
    <div class="container">
        <div class="panel">
            <label for="decoded">Decoded</label>
            <textarea id="decoded" rows="6" placeholder="Skriv noe her…"></textarea>
        </div>

        <div class="panel">
            <div class="panel-title" id="wheel-title">Chifferskive (klikk og dra) </div>
            <div class="wheel">
                <div class="row row-top">
                    <div class="strip" id="strip" tabindex="0" role="slider"
                         aria-labelledby="wheel-title" aria-valuemin="0"></div>
                </div>
                <div class="row row-bottom" id="plain"></div>
            </div>
        </div>

        <div class="panel">
            <label for="encoded">Encoded</label>
            <textarea id="encoded" rows="6" placeholder="…eller skriv kodet tekst her"></textarea>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
