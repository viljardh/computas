<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cæsar-chiffer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>🔐 Cæsar-chiffer</h1>
    <div class="container">
        <div class="panel">
            <div class="controls">
                <div class="control">
                    <div class="panel-title" id="mode-title">Modus</div>
                    <div class="toggle" role="radiogroup" aria-labelledby="mode-title">
                        <input type="radio" name="mode" id="mode-encode" value="encode" checked>
                        <label for="mode-encode">Kod</label>
                        <input type="radio" name="mode" id="mode-decode" value="decode">
                        <label for="mode-decode">Dekod</label>
                    </div>
                </div>

                <div class="control">
                    <label for="shift">Forskyvning</label>
                    <div class="stepper">
                        <button type="button" id="shift-minus" aria-label="Minus én">−</button>
                        <input type="number" id="shift" value="3" step="1">
                        <button type="button" id="shift-plus" aria-label="Pluss én">+</button>
                    </div>
                </div>
            </div>
            <div id="error" class="error" role="alert"></div>
        </div>

        <div class="panel">
            <div class="panel-title" id="wheel-title">Chifferskive (klikk og dra) </div>
            <div class="wheel">
                <div class="row row-top">
                    <div class="strip" id="strip" tabindex="0" role="slider"
                         aria-labelledby="wheel-title" aria-valuemin="0"></div>
                </div>
                <div class="row row-bottom" id="plain"></div>
            </div>
            <div class="wheel-caption" id="caption"></div>
        </div>

        <div class="panel">
            <label for="input">Input</label>
            <textarea id="input" rows="6" placeholder="Skriv noe her…"></textarea>
        </div>

        <div class="panel">
            <label for="output">Output</label>
            <textarea id="output" rows="6" readonly></textarea>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
