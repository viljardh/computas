<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cæsar-chiffer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>🔐 Cæsar-chiffer</h1>
    <div class="container">
        <div class="panel">
            <div class="toggle" role="radiogroup" aria-label="Modus">
                <input type="radio" name="mode" id="mode-encode" value="encode" checked>
                <label for="mode-encode">Kod</label>
                <input type="radio" name="mode" id="mode-decode" value="decode">
                <label for="mode-decode">Dekod</label>
            </div>

            <label for="shift">Forskyvning</label>
            <input type="number" id="shift" value="3" step="1">
            <div id="error" class="error" role="alert"></div>
        </div>

        <div class="panel">
            <label for="input">Input</label>
            <textarea id="input" rows="6" placeholder="Skriv noe her…"></textarea>
        </div>

        <div class="panel">
            <label for="output">Output</label>
            <textarea id="output" rows="6" readonly></textarea>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
